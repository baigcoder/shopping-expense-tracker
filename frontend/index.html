  <!-- Preconnect for critical third-party origins -->
  <link rel="preconnect" href="https://ynmvjnsdygimhjxcjvzp.supabase.co" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Security Headers -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />

  <!-- SEO -->
  <meta name="robots" content="index, follow" />
  <meta name="application-name" content="Cashly" />
  <meta name="description"
    content="Cashly is a review-first finance workspace for smart expense tracking, browser-extension sync, budgeting, reports, and AI-powered money insights." />
  <meta property="og:site_name" content="Cashly" />
  <meta property="og:title" content="Cashly - Review-First Finance Automation" />
  <meta property="og:description"
    content="Review every automated transaction before it hits your ledger, track budgets, and understand your money with AI-powered insights." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/logo.png" />
  <meta name="twitter:title" content="Cashly - Review-First Finance Automation" />
  <meta name="twitter:description"
    content="Automated expense tracking with review-first transactions, budgets, reports, browser-extension sync, and AI-powered financial insights." />
  <meta name="twitter:image" content="/logo.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <title>Cashly - Review-First Finance Automation</title>

  <!-- Font with display swap for faster text rendering -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap"
      rel="stylesheet" />
  </noscript>

  <!-- Critical CSS inline for faster first paint -->
  <style>
    body {
      margin: 0;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background: #ffffff;
    }

    #root {
      min-height: 100vh;
    }

    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #ffffff;
      gap: 24px;
    }

    .loading-logo {
      width: 56px;
      height: 56px;
      background: #09090b;
      border: 3px solid #09090b;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
      font-weight: 900;
      box-shadow: 6px 6px 0 #e11d48;
      animation: pulse 2s ease-in-out infinite;
    }

    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(9, 9, 11, 0.14);
      border-top-color: #e11d48;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.8;
        transform: scale(0.95);
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="loading-screen">
      <div class="loading-logo">C</div>
      <div class="loading-spinner"></div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- Local cache cleanup: old PWA workers cached stale JS bundles. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.getRegistrations()
          .then((registrations) => Promise.all(registrations.map((registration) => registration.unregister())))
          .then(() => {
            if (window.caches) {
              return caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key))));
            }
          })
          .catch(() => { });
      });
    }
  </script>
</body>

</html>

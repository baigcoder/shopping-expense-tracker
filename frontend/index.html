  <title>Cashly — Cinematic Financial Operating System</title>

  <!-- Font with display swap for faster text rendering -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet" />
  </noscript>

  <!-- Critical CSS inline for faster first paint -->
  <style>
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
      background: #F4F3EE;
      color: #111111;
    }

    #root {
      min-height: 100vh;
    }

    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #F4F3EE;
      gap: 18px;
    }

    .loading-mark-wrapper {
      position: relative;
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading-halo {
      position: absolute;
      width: 82px;
      height: 82px;
      border-radius: 50%;
      border: 2px solid rgba(238, 80, 36, 0.15);
      border-top-color: #EE5024;
      animation: cashlySpin 1.1s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
    }

    .loading-logo-squircle {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: linear-gradient(135deg, #FF5E33 0%, #E44114 100%);
      box-shadow: 0 10px 25px -5px rgba(238, 80, 36, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .loading-logo-svg {
      width: 32px;
      height: 32px;
    }

    .loading-status-text {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 15px;
      color: #111111;
      letter-spacing: -0.02em;
    }

    .loading-runway-track {
      width: 110px;
      height: 3px;
      border-radius: 999px;
      background: rgba(17, 17, 17, 0.08);
      overflow: hidden;
      position: relative;
    }

    .loading-runway-bar {
      position: absolute;
      height: 100%;
      width: 45%;
      border-radius: 999px;
      background: #EE5024;
      animation: cashlyRunwayShift 1.4s ease-in-out infinite alternate;
    }

    @keyframes cashlySpin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes cashlyRunwayShift {
      0% {
        left: -20%;
        width: 30%;
      }
      100% {
        left: 85%;
        width: 35%;
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="loading-screen">
      <div class="loading-mark-wrapper">
        <div class="loading-halo"></div>
        <div class="loading-logo-squircle">
          <svg class="loading-logo-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g transform="translate(32, 32)">
              <path d="M 14 -13 C 8.5 -19.5, -4 -21.5, -12.5 -16 C -22 -9.5, -23.5 5, -16 14.5 C -8.5 23.5, 4.5 23, 13.5 15.5 C 14.8 14.3, 15.8 12.8, 16 11 L 9.5 9 C 9 10.5, 8 11.5, 7 12.5 C 1.5 17.5, -7.5 17, -12 11 C -16.5 4.5, -15 -6, -9 -11 C -3.5 -15.5, 5 -14.5, 9.5 -9.5 Z" fill="#FFFFFF" />
              <path d="M -5 1 L 15 1 C 18 1, 20.5 -1.5, 20.5 -4.5 C 20.5 -7.5, 18 -10, 15 -10 L 9 -10" stroke="#FFE7DF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
              <circle cx="0" cy="1" r="3.2" fill="#FFFFFF" />
            </g>
          </svg>
        </div>
      </div>
      <div class="loading-status-text">Cashly</div>
      <div class="loading-runway-track">
        <div class="loading-runway-bar"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- Local cache cleanup: old PWA workers cached stale JS bundles. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.getRegistrations()
          .then((registrations) => Promise.all(registrations.map((registration) => registration.unregister())))
          .then(() => {
            if (window.caches) {
              return caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key))));
            }
          })
          .catch(() => { });
      });
    }
  </script>
</body>

</html>

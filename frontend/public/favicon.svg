<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Rich Cadmium Orange to Deep Ember Gradient -->
    <linearGradient id="cashlyFaviconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E33" />
      <stop offset="100%" stop-color="#E44114" />
    </linearGradient>

    <!-- Crisp Highlight Gradient -->
    <linearGradient id="cashlyMarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFEBE5" />
    </linearGradient>

    <!-- Forward Trajectory Accent Gradient -->
    <linearGradient id="cashlyTrajectory" x1="20%" y1="80%" x2="80%" y2="20%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFE7DF" />
    </linearGradient>
  </defs>

  <!-- Architectural Precision Squircle Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#cashlyFaviconBg)" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.5" />

  <!-- Subtle Top Specular Rim Reflection -->
  <path d="M 6 20 C 6 11 12 5 21 5 L 43 5 C 52 5 58 11 58 20" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.2" stroke-linecap="round" fill="none" />

  <!-- Cashly Sovereign Monogram Symbol -->
  <g transform="translate(32, 32)">
    <!-- Bold Outer 'C' Ribbon -->
    <path
      d="M 14 -13
         C 8.5 -19.5, -4 -21.5, -12.5 -16
         C -22 -9.5, -23.5 5, -16 14.5
         C -8.5 23.5, 4.5 23, 13.5 15.5
         C 14.8 14.3, 15.8 12.8, 16 11
         L 9.5 9
         C 9 10.5, 8 11.5, 7 12.5
         C 1.5 17.5, -7.5 17, -12 11
         C -16.5 4.5, -15 -6, -9 -11
         C -3.5 -15.5, 5 -14.5, 9.5 -9.5
         Z"
      fill="url(#cashlyMarkGrad)"
    />

    <!-- Forward Trajectory Curve -->
    <path
      d="M -5 1 L 15 1 C 18 1, 20.5 -1.5, 20.5 -4.5 C 20.5 -7.5, 18 -10, 15 -10 L 9 -10"
      stroke="url(#cashlyTrajectory)"
      stroke-width="3.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Sovereign Core Checkpoint Dot -->
    <circle cx="0" cy="1" r="3.2" fill="#FFFFFF" />
  </g>
</svg>
